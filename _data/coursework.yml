      - code: SPN201
        title: Beginning Spanish I
        ects: 4
        tag: A1 completed
        focus: Foundational Spanish vocabulary, grammar, listening, speaking, reading, and writing through CEFR level A1.
        details: Introduces basic spoken and written Spanish through everyday vocabulary, elementary grammar, listening and reading comprehension, short written production, and simple interaction. The completed sequence corresponds to the first stage of my A1 progression.
        official_url: https://catalog.metu.edu.tr/prog_courses.php?prog=371
      - code: SPN202
        title: Beginning Spanish II
        ects: 4
        tag: A2 completed
        focus: Continued Spanish study through CEFR level A2, expanding practical communication, grammar, and comprehension.
        details: Builds on the introductory course with broader vocabulary, more developed grammar, connected spoken and written communication, and comprehension of routine situations. Together with the first course, it completed my progression through A2.
        official_url: https://catalog.metu.edu.tr/prog_courses.php?prog=371
      - code: ENGL101
        title: Development of Reading and Writing Skills I
        ects: 6
        focus: Academic reading, paragraph development, source use, and structured written communication in English.
        details: Develops academic reading strategies and the construction of clear paragraphs and short essays. Work focuses on organization, cohesion, vocabulary in context, interpretation of source texts, and accurate written communication for an English-medium degree.
        official_url: https://catalog.metu.edu.tr/prog_courses.php?prog=359
      - code: ENGL102
        title: Development of Reading and Writing Skills II
        ects: 6
        focus: Extended academic reading and writing, argument development, synthesis, and evidence-based composition.
        details: Extends academic literacy through longer readings, synthesis of multiple sources, argument construction, evidence use, revision, and structured essay writing. The course places greater emphasis on critical response and sustained written reasoning.
        official_url: https://catalog.metu.edu.tr/prog_courses.php?prog=359
      - code: ENGL211
        title: Academic Oral Presentation Skills
        ects: 4
        focus: Research-based presentations, audience-aware organization, visual support, delivery, and academic discussion.
        details: Develops the planning and delivery of academic presentations, including research, selection and organization of content, audience awareness, visual support, signposting, pronunciation, delivery, question handling, and participation in academic discussion.
        official_url: https://catalog.metu.edu.tr/prog_courses.php?prog=359
      - code: ENGL311
        title: Advanced Communication Skills
        ects: 4
        focus: Advanced professional and academic communication across written, spoken, and collaborative settings.
        details: Applies advanced English communication to professional and academic situations through analytical reading, formal writing, presentations, meetings, teamwork, and audience-specific messages. The focus is on clarity, persuasion, and confident communication in complex settings.
        official_url: https://catalog.metu.edu.tr/prog_courses.php?prog=359

  - name: University studies and professional foundations
    summary: Programme orientation, Turkish language, modern Turkish history, and workplace safety.
    courses:
      - code: CNG100
        title: Introduction to Information Technologies and Applications
        ects: 1
        focus: Practical orientation to computing tools, information technologies, and responsible use of university IT resources.
        details: Provides practical familiarity with common information technologies, digital tools, university computing services, online collaboration, information access, and responsible use of IT systems at the beginning of the degree.
      - code: CNG101
        title: Computer Engineering Orientation
        ects: 1
        focus: Introduction to the Computer Engineering programme, its technical areas, study practices, professional roles, and ethical responsibilities.
        details: Introduces the structure and expectations of the Computer Engineering programme, the major technical areas within the discipline, effective study and teamwork practices, professional roles, engineering ethics, and possible academic and career directions.
      - code: TUR101
        title: Turkish I
        ects: 2
        focus: Turkish language, written expression, and effective communication in academic and professional contexts.
