tum:
  - name: Machine learning and data analysis
    summary: Statistical learning, neural networks, practical data analysis, and medical applications of AI.
    courses:
      - code: IN2064
        title: Machine Learning
        ects: 8
        focus: Probabilistic learning, supervised and unsupervised methods, dimensionality reduction, mixture models, and model evaluation.
        details: The module develops a probabilistic view of machine learning, moving from regression and classification to unsupervised methods. Its scope includes Bayesian decision theory, density estimation, mixture models, expectation maximization, dimensionality reduction, kernel methods, and principled evaluation of learned models.
        official_url: https://support.moodle.tum.de/course/info.php?id=100567
      - code: IN2346
        title: Introduction to Deep Learning
        ects: 6
        focus: Neural networks, backpropagation, optimization, regularization, convolutional architectures, sequence models, and transformers.
        details: The course starts with linear classifiers and maximum-likelihood learning before developing neural networks, stochastic gradient descent, backpropagation, activation functions, initialization, batch normalization, and hyperparameter optimization. It then covers convolutional architectures, regularization, recurrent networks, LSTMs, transformers, and practical image-classification problems.
        official_url: https://academics.nat.tum.de/en/studies/org/mh/details/mod/IN2346
      - code: IN2339
        title: Data Analysis and Visualization in R
        ects: 6
        focus: Data preparation, reproducible analysis, visualization, statistical testing, unsupervised learning, and predictive modelling in R.
        details: Organized around obtaining, exploring, and drawing conclusions from real-world data, the module covers R programming, reproducible reports, importing and tidying data, and visualization through the grammar of graphics. Later topics include clustering, principal-component analysis, resampling-based inference, statistical testing, supervised learning, and complete case-study workflows.
        official_url: https://www.cs.cit.tum.de/en/cmm/training-and-teaching/winter-term-2020/data-analysis-and-visualization-in-r/
      - code: IN2403
        title: Artificial Intelligence in Medicine
        ects: 5
        focus: Machine learning methods and evaluation considerations for medical data and clinical applications.
        details: This lecture series examines how machine-learning and neural-network methods are used across medical applications. The emphasis is not only on model construction, but also on the characteristics of clinical and imaging data, meaningful evaluation, reliability, and the practical constraints that distinguish medical AI from general benchmark problems.
        official_url: https://kiinformatik.mri.tum.de/es/node/2826

  - name: Software quality and dependable AI
    summary: Software testing, requirements, and the engineering of safe, resilient learning-enabled systems.
    courses:
      - code: CIT423002
        title: AI Testing
        ects: 5
        focus: Testing strategies and evaluation methods for AI-based software, including the challenges introduced by learned behaviour.
        details: The module treats learned components as software whose behavior depends on data, training, and operating context. It studies how conventional testing concepts must be adapted for AI systems, including test-data design, behavioral properties, adequacy criteria, robustness assessment, and evaluation when a simple test oracle is unavailable.
        official_url: https://www.moodle.tum.de/course/info.php?id=105602&lang=en
      - code: CIT4230005
        title: Engineering Resilient Cognitive Systems
        ects: 3
        focus: Safety assurance, resilience, SOTIF, and adaptive architectures for cognitive cyber-physical systems operating under uncertainty.
        details: The lecture introduces resilience as maintaining safety while optimizing utility in uncertain environments. It covers safety and reliability foundations, Safety of the Intended Functionality, assurance challenges for AI-based systems, and self-adaptive safety architectures for autonomous vehicles, robotics, medical devices, and other cognitive cyber-physical systems.
        official_url: https://www.cs.cit.tum.de/en/ercs/teaching/lecture-engineering-resilient-cognitive-systems/
      - code: IN2084
        title: Advanced Topics of Software Testing
        ects: 5
        focus: Advanced verification and testing topics, with emphasis on systematic quality assessment for complex software systems.
        details: This advanced module studies systematic ways to reveal faults and assess software quality beyond basic unit testing. Its scope includes test design and selection, structural and behavioral coverage, automation, regression-oriented strategies, and research-driven approaches for testing complex and evolving software systems.
        official_url: https://www.cs.cit.tum.de/en/sse/teaching/
      - title: Requirements Engineering
        ects: 3
        focus: Eliciting, structuring, analysing, validating, and managing functional and quality requirements across a system lifecycle.
        details: The course follows requirements from stakeholder discovery to controlled evolution. It addresses elicitation, documentation, modelling, prioritization, validation, conflict resolution, traceability, and change management for both functional requirements and quality attributes.
        official_url: https://www.cs.cit.tum.de/en/sse/teaching/

  - name: Scientific computing
    summary: Quantum-computing foundations and systems-oriented scientific simulation work.
    courses:
      - code: IN2381
        title: Introduction to Quantum Computing
        ects: 5
        focus: Quantum states, gates, circuits, measurement, and the computational ideas behind quantum algorithms.
        details: The module introduces the mathematical representation of qubits and multi-qubit systems, unitary gates, quantum circuits, entanglement, and measurement. It then develops the computational ideas behind representative quantum algorithms and contrasts quantum information processing with classical computation.
        official_url: https://www.cs.cit.tum.de/en/qc/teaching/
      - code: IN2311
        title: Turbulent Flow Simulation on HPC-Systems
        ects: 5
        tag: Documented as a project
        focus: Distributed C++ simulation, MPI coordination, scientific data formats, parallel I/O, and performance evaluation.
        details: The module connects numerical flow simulation with high-performance implementation. It covers the structure of a distributed C++ solver, domain decomposition, MPI communication, parallel numerical kernels, scientific output formats, scalable I/O, visualization workflows, profiling, and performance evaluation on HPC systems.
        official_url: https://www.cs.cit.tum.de/en/sccs/people/benjamin-rueth/
        link: /projects/parallel-hdf5-cfd-output/

  - name: German language progression
