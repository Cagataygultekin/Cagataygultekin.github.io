<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Multi-level call-chain detection</title>
  <desc id="desc">A method call chain reaches a repository save call from inside a loop and is combined with runtime sampling to produce a severity-ranked finding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1600" height="820" rx="32" fill="url(#bg)"/>
  <text x="78" y="78" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="750" fill="#0f172a">Finding an indirect database call inside a loop</text>
  <text x="78" y="118" font-family="Inter, Arial, sans-serif" font-size="20" fill="#475569">The analyzer follows method relationships instead of checking only the current source file.</text>

  <g transform="translate(78 190)">
    <g filter="url(#shadow)">
      <rect width="280" height="190" rx="22" fill="#fff" stroke="#bfdbfe"/>
      <rect width="280" height="48" rx="22" fill="#1d4ed8"/>
      <rect y="28" width="280" height="20" fill="#1d4ed8"/>
      <text x="22" y="32" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#fff">updateCatalog()</text>
      <text x="24" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#334155">loadProducts();</text>
      <text x="24" y="119" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#334155">syncInventory();</text>
      <text x="24" y="160" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">entry point</text>
    </g>

    <g transform="translate(365)" filter="url(#shadow)">
      <rect width="310" height="190" rx="22" fill="#fff" stroke="#c4b5fd"/>
      <rect width="310" height="48" rx="22" fill="#6d28d9"/>
      <rect y="28" width="310" height="20" fill="#6d28d9"/>
      <text x="22" y="32" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#fff">syncInventory()</text>
      <text x="24" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#334155">for (Product p : items) {</text>
      <text x="42" y="119" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#7c3aed">persistProduct(p);</text>
      <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#334155">}</text>
      <text x="190" y="171" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed">loop boundary</text>
    </g>

    <g transform="translate(760)" filter="url(#shadow)">
      <rect width="310" height="190" rx="22" fill="#fff" stroke="#fdba74"/>
      <rect width="310" height="48" rx="22" fill="#c2410c"/>
      <rect y="28" width="310" height="20" fill="#c2410c"/>
      <text x="22" y="32" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#fff">persistProduct()</text>
      <text x="24" y="91" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#334155">validate(product);</text>
      <text x="24" y="127" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" fill="#c2410c">repository.save(product);</text>
      <text x="24" y="162" font-family="Inter, Arial, sans-serif" font-size="15" fill="#9a3412">configured third-party method</text>
    </g>

    <g transform="translate(1155)" filter="url(#shadow)">
      <rect width="290" height="190" rx="22" fill="#fff" stroke="#86efac"/>
      <rect width="290" height="48" rx="22" fill="#047857"/>
      <rect y="28" width="290" height="20" fill="#047857"/>
      <text x="22" y="32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">ANALYSIS OUTPUT</text>
      <text x="24" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#334155">type: BOTH</text>
      <text x="24" y="119" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#334155">severity: HIGH</text>
      <text x="24" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#334155">source: line 74</text>
    </g>

    <path d="M280 95H350" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M675 95H745" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1070 95H1140" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(78 465)">
    <rect width="1445" height="250" rx="24" fill="#0f172a"/>
    <text x="30" y="48" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750" letter-spacing="1.5" fill="#bfdbfe">WHY THE COMBINATION MATTERS</text>

    <g transform="translate(30 78)">
      <rect width="425" height="128" rx="18" fill="#172554" stroke="#3b82f6"/>
      <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750" fill="#dbeafe">1. Static structure</text>
      <text x="24" y="72" font-family="Inter, Arial, sans-serif" font-size="16" fill="#bfdbfe">A call chain carries a configured repository</text>
      <text x="24" y="98" font-family="Inter, Arial, sans-serif" font-size="16" fill="#bfdbfe">method through a loop, even across several methods.</text>
    </g>

    <g transform="translate(505 78)">
      <rect width="425" height="128" rx="18" fill="#312e81" stroke="#8b5cf6"/>
      <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750" fill="#ede9fe">2. Runtime sampling</text>
      <text x="24" y="72" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ddd6fe">Snapshot data provides execution time evidence</text>
      <text x="24" y="98" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ddd6fe">for the entry method under observation.</text>
    </g>

    <g transform="translate(980 78)">
      <rect width="435" height="128" rx="18" fill="#064e3b" stroke="#34d399"/>
      <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750" fill="#d1fae5">3. Ranked developer feedback</text>
      <text x="24" y="72" font-family="Inter, Arial, sans-serif" font-size="16" fill="#a7f3d0">The report combines source location, path,</text>
      <text x="24" y="98" font-family="Inter, Arial, sans-serif" font-size="16" fill="#a7f3d0">analysis type, execution time, and severity.</text>
    </g>
  </g>
</svg>
